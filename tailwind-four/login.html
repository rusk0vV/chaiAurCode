<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./output.css">
    <title>Document</title>
</head>

<body class="bg-gray-900 flex justify-center items-center min-h-screen">
    <div class="bg-gray-700 rounded-lg p-8 shadow-lg max-w-sm w-full">
        <h2 class="text-3xl font-bold mb-8 text-center text-white">Login</h2>
        <form>
            <div class="mb-4">
                <label for="" class="block text-sm font-medium text-gray-300 mb-4">Email
                    <input type="email" name="" placeholder="Enter Your Email" class="block w-full mt-2 px-3 py-2 bg-gray-800 text-white placeholder-gray-400 rounded-md">
                </label>
            </div>
        
            <div class="mb-4">
                <label for="" class="block text-sm font-medium text-gray-300 mb-4">Password
                    <input type="password" name="" placeholder="Enter Your Password" class="block w-full mt-2 px-3 py-2 bg-gray-800 text-white placeholder-gray-400 rounded-md">
                </label>
            </div>
            <button type="submit" class="py-2 w-full rounded-lg bg-blue-600 hover:bg-blue-700 transition text-white font-medium">
                Login
            </button>
        </form>
    </div>
    
</body>

</html>
